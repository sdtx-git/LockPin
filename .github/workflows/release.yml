name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true

      - name: Keep portable binary
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: |
            src-tauri/target/release/lockpin.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  portable:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: artifacts

      - name: Assemble portable folder
        run: |
          mkdir -p LockPin
          cp "$(find artifacts -name 'lockpin.exe' | head -n1)" LockPin/LockPin.exe
          cp "$(find artifacts -name '*.AppImage' | head -n1)" LockPin/LockPin.AppImage
          cp docker/LockPin.sh LockPin/LockPin.sh
          chmod +x LockPin/LockPin.AppImage LockPin/LockPin.sh
          zip -r "LockPin-portable-${GITHUB_REF_NAME}.zip" LockPin

      - name: Upload portable package
        uses: softprops/action-gh-release@v2
        with:
          files: LockPin-portable-*.zip
